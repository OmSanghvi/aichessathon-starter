[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "numba==0.67.0",
    "torch==2.13.0",
    "onnxruntime==1.29.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# agent_header.py and agent_footer.py are FRAGMENTS, not modules: build_agent.py
# concatenates them around the engine source to produce agent.py. Each half
# references names the other half defines, so linting them standalone is
# meaningless. The assembled agent.py is linted normally and is what ships.
"nengine/agent_header.py" = ["F401", "F821", "E402"]
"nengine/agent_footer.py" = ["F821", "E402"]

[tool.mypy]
strict = true
files = ["agent.py", "harness"]
